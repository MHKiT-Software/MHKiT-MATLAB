name: MHKiT-MATLAB MATLAB Only Modules Unit Tests

# Runs the unit tests for modules that are implemented in MATLAB only
#
# The list of test files is in mhkit/tests/runMatlabOnlyTests.m
# Run locally with:
# - MacOS: scripts/run_matlab_only_tests_macos.sh
# - Windows: scripts\run_matlab_only_tests_windows.ps1

on:
  workflow_dispatch: {}
  push:
    branches: [ master, develop ]
    paths:
      - 'mhkit/**/*.m'
      - 'examples/data/**'
      - '.github/workflows/matlab_only_unit_tests.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'mhkit/**/*.m'
      - 'examples/data/**'
      - '.github/workflows/matlab_only_unit_tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: ${{ matrix.matlab-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is intentionally omitted, may be added back in the future.
        os: [macos-15, windows-2025]
        matlab-version: [R2023b, R2024a, R2024b, R2025a, R2025b]

    steps:
      - name: Check out MHKiT-MATLAB
        uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab-version }}

      - name: Run MATLAB only unit tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(fullfile("mhkit", "tests"));
            results = runMatlabOnlyTests();
            assertSuccess(results);
          startup-options: -noFigureWindows
