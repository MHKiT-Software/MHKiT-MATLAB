name: Check Docstrings

# Run on all pushes and pull requests to catch docstring issues early
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  check-docstrings:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run docstring checker
      id: docstring_check
      run: |
        python scripts/check_docstrings.py --verbose
        exit_code=$?
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

        # Exit code 0 = pass, 1 = critical errors, 2 = warnings only
        if [ $exit_code -eq 1 ]; then
          echo "::error::Critical docstring errors found that will break Sphinx documentation build!"
          exit 1
        elif [ $exit_code -eq 2 ]; then
          echo "::warning::Some docstrings have warnings. Please review and fix when possible."
          exit 0
        else
          echo "All docstrings properly formatted!"
          exit 0
        fi
