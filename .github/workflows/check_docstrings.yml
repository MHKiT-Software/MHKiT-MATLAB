name: Check Docstrings

# Run on all pushes and pull requests to catch docstring issues early
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  check-docstrings:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run docstring checker
      run: |
        python scripts/check_docstrings.py --verbose
      continue-on-error: false

    - name: Check for critical errors
      if: failure()
      run: |
        echo "::error::Docstring validation failed! Critical errors found that will break Sphinx documentation build."
        echo "Please review the errors above and fix them according to the formatting section in CONTRIBUTING.md"
        exit 1
