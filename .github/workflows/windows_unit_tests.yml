name: MHKiT-MATLAB Windows Unit Tests

# Runs the full unit test suite, including tests that call MHKiT-Python
#
# Run locally with:
# - Windows: scripts\run_python_tests_windows.ps1 C:\path\to\python.exe
#
# The script and this workflow both call mhkit/tests/runPythonTests.m, which
# places the Python environment's DLL folders first on PATH so MATLAB's bundled
# expat and OpenSSL DLLs do not break Python imports. This workflow runs MATLAB
# with run-command instead of the script because public project MATLAB licensing
# on GitHub Actions requires the MATLAB actions.

on:
  workflow_dispatch: {}
  push:
    branches: [ master, develop ]
    paths:
      - 'mhkit/**/*.m'
      - 'mhkit_python_utils/**'
      - 'examples/data/**'
      - 'pyproject.toml'
      - '.github/workflows/windows_unit_tests.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'mhkit/**/*.m'
      - 'mhkit_python_utils/**'
      - 'examples/data/**'
      - 'pyproject.toml'
      - '.github/workflows/windows_unit_tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: ${{ matrix.matlab-version }}, Python ${{ matrix.python-version }}, MHKiT-Python ${{ matrix.mhkit-python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        matlab-version: [R2025b, R2026b]
        python-version: ["3.12"]
        mhkit-python-version: ["1.1.2"]

    steps:
      - name: Check out MHKiT-MATLAB
        uses: actions/checkout@v7

      # conda-forge provides netcdf4, hdf5, and BLAS builds that are consistent
      # with each other, which avoids native library conflicts with MATLAB
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: mhkit_conda_env
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install MHKiT-Python and mhkit_python_utils
        shell: bash -l {0}
        run: |
          conda install -y "numpy>=2" pip netcdf4 hdf5
          # pecos 1.0.0 (used by the qc module) check_delta fails with pandas 3
          pip install "mhkit[all]==${{ matrix.mhkit-python-version }}" "pandas<3"
          pip install -e .
          pip list
          python -c "import mhkit, mhkit_python_utils; print('MHKiT-Python', mhkit.__version__)"
          echo "MHKIT_PYTHON_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab-version }}

      # Fails fast with a readable summary if MATLAB cannot import the Python
      # modules, usually from native library conflicts between MATLAB and Python
      - name: Check Python imports from MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(fullfile("mhkit", "tests"));
            runPythonTests(getenv("MHKIT_PYTHON_EXE"), ImportCheckOnly=true);
          startup-options: -noFigureWindows

      - name: Run MATLAB unit tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(fullfile("mhkit", "tests"));
            results = runPythonTests(getenv("MHKIT_PYTHON_EXE"));
            disp(table(results));
            assertSuccess(results);
          startup-options: -noFigureWindows
